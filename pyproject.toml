[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olx-iphone-scanner"
version = "1.0.0"
description = "Real-time terminal scanner & DeepSeek AI appraiser for OLX iPhone offers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "k4rror" }]
dependencies = [
    "tls-client>=1.0.1",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "fake-useragent>=1.4.0",
    "requests>=2.31.0",
    "openai>=1.12.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
]

[project.scripts]
olx-scanner = "olx_scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

# Wskazanie właściwego folderu źródłowego dla Hatchlinga:
[tool.hatch.build.targets.wheel]
packages = ["src/olx_scanner"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Sprawdzone reguły wyłapujące realne błędy i dbające o czystość kodu:
select = [
    "E4", "E7", "E9", # Krytyczne błędy składniowe i standardowe błędy kodu
    "F",              # Pyflakes (nieużywane importy, niezdefiniowane zmienne itp.)
    "I",              # isort (automatyczne sortowanie importów)
    "UP",             # pyupgrade (nowoczesna składnia Pythona 3.10+)
    "B",              # flake8-bugbear (rzeczywiste błędy logiczne i pułapki)
]
ignore = [
    "E501",   # Ignoruj długość linii (teksty i18n, zapytania SQL, nagłówki User-Agent)
    "RUF001", # Ignoruj homoglify cyrylicy w stringach (niezbędne dla języków uk i be!)
    "RUF002", # Ignoruj homoglify w docstringach
    "RUF003", # Ignoruj homoglify w komentarzach
    "B008",   # Do not perform function call in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]