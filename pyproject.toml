[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olx-iphone-scanner"
version = "1.0.0"
description = "Real-time terminal scanner & DeepSeek AI appraiser for OLX iPhone offers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "k4rror" }]
dependencies = [
    "tls-client>=1.0.1",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "fake-useragent>=1.4.0",
    "requests>=2.31.0",
    "openai>=1.12.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.0",
]

[project.scripts]
olx-scanner = "olx_scanner.cli:main"
olx-dashboard = "olx_scanner.web.app:run_server"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olx_scanner"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]