name: Release

# Tworzy GitHub Release przy wypchnięciu tagu w formacie v* (np. v1.0.0).
#
# Tytuł i treść wydania pochodzą z komunikatu tagu:
#     git tag -a v1.0.0 -F notes.md      # plik UTF-8
#   pierwsza linia komunikatu -> tytuł wydania
#   reszta                     -> treść changelogu (markdown)
#
# Komunikat czytamy przez API GitHuba, a nie przez `git tag -l --format=...`:
# actions/checkout materializuje tag jako referencję lekką (refs/tags/<tag>
# wskazuje wprost na commit), więc %(contents:*) zwracałoby komunikat commita.
#
# Gdy tag nie ma komunikatu (albo jest lekki), treść generuje GitHub na
# podstawie commitów od poprzedniego wydania (--generate-notes).
#
# Workflow jest idempotentny: gdy wydanie już istnieje, aktualizuje jego tytuł
# i treść. Można go też uruchomić ręcznie (workflow_dispatch) z zakładki
# Actions, podając tag — przydatne do poprawienia opisu wydania.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do opublikowania (np. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Wymagany przez `gh release create --verify-tag`, które uruchamia git
      # w lokalnym repozytorium (bez tego: „fatal: not a git repository").
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Odczytaj tytuł i treść z tagu
        run: |
          set -euo pipefail

          TITLE_FILE="$RUNNER_TEMP/title.txt"
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          : > "$NOTES_FILE"

          REF_URL="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if ! gh api "$REF_URL" >/dev/null 2>&1; then
            echo "::error::Tag $TAG nie istnieje w repozytorium. Wypchnij go: git push origin $TAG"
            exit 1
          fi

          TYPE=$(gh api "$REF_URL" --jq .object.type)
          echo "Typ obiektu w refs/tags/$TAG: $TYPE"

          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api "$REF_URL" --jq .object.sha)
            FULL="$RUNNER_TEMP/tag-message.txt"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq .message > "$FULL"

            head -n 1 "$FULL" > "$TITLE_FILE"
            tail -n +2 "$FULL" | sed '/./,$!d' > "$NOTES_FILE"
          fi

          # Tytuł zapasowy, gdy tag nie ma komunikatu albo zaczyna się od pustej linii.
          if [ ! -s "$TITLE_FILE" ]; then
            printf '%s' "$TAG" > "$TITLE_FILE"
          fi

      - name: Opublikuj wydanie
        run: |
          set -euo pipefail

          TITLE=$(cat "$RUNNER_TEMP/title.txt")
          NOTES_FILE="$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            MODE="edit"
            echo "Wydanie $TAG już istnieje – aktualizuję opis."
          else
            MODE="create"
            echo "Tworzę wydanie $TAG."
          fi

          if [ -n "$(tr -d '[:space:]' < "$NOTES_FILE")" ]; then
            echo "Treść changelogu pochodzi z komunikatu tagu."
            if [ "$MODE" = "edit" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --verify-tag
            fi
          else
            echo "Tag bez komunikatu – treść generuję z commitów."
            if [ "$MODE" = "edit" ]; then
              gh release edit "$TAG" --title "$TITLE"
            else
              gh release create "$TAG" --title "$TITLE" --generate-notes --verify-tag
            fi
          fi
