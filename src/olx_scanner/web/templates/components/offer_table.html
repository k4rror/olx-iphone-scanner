<section class="card overflow-hidden">
  <div id="offers-scroll" class="table-scroll overflow-x-auto min-h-[420px]">
    <table id="offers-table" class="table min-w-[980px]">
      <thead>
        <tr>
          <th class="w-11 text-center"><span class="sr-only">{{ t('a_fav') }}</span><i data-lucide="star" class="w-3 h-3 inline" aria-hidden="true"></i></th>
          <th class="min-w-[210px]">{{ t('th_model') }}</th>
          <th class="text-right w-[150px]">{{ t('th_price') }}</th>
          <th class="text-center w-[110px]">{{ t('th_battery') }}</th>
          <th class="min-w-[220px]">{{ t('th_state') }}</th>
          <th class="hidden xl:table-cell w-[120px]">{{ t('th_location') }}</th>
          <th class="text-right w-[120px]">{{ t('th_actions') }}</th>
        </tr>
      </thead>
      <tbody id="offers-tbody"></tbody>
    </table>
    <!-- Row Comparison Dock – overlay pozycjonowany przez offers.js (placeDock) -->
    <div id="compare-dock" class="compare-dock" aria-hidden="true"></div>
  </div>

  <div class="px-4 py-2.5 border-t border-line flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
    <div class="flex items-center gap-3 text-[11.5px] text-muted">
      <span id="pagination-info">{{ t('pg_info', page=1, total=1, offers='0') }}</span>
      <select id="page-size-select" onchange="setPageSize(this.value)" class="select select-sm w-auto" aria-label="{{ t('pg_per_page', n=25) }}">
        <option value="25">{{ t('pg_per_page', n=25) }}</option>
        <option value="50">{{ t('pg_per_page', n=50) }}</option>
        <option value="100">{{ t('pg_per_page', n=100) }}</option>
      </select>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="page-prev-btn" onclick="changePage(-1)" class="btn btn-white btn-xs" aria-label="{{ t('btn_prev') }}">
        <i data-lucide="chevron-left" class="w-3 h-3"></i> {{ t('btn_prev') }}
      </button>
      <span id="pagination-current" class="chip chip-dark font-mono tabular-nums">1 / 1</span>
      <button id="page-next-btn" onclick="changePage(1)" class="btn btn-white btn-xs" aria-label="{{ t('btn_next') }}">
        {{ t('btn_next') }} <i data-lucide="chevron-right" class="w-3 h-3"></i>
      </button>
    </div>
  </div>
</section>
