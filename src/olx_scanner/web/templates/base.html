<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>{% block title %}{{ t('app_name') }}{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:    { DEFAULT: '#18181B', 800: '#27272A', 700: '#3F3F46' },
            paper:  '#F4F4F5',
            line:   '#E4E4E7', 'line-soft': '#ECEDEF', 'line-strong': '#D4D4D8',
            muted:  '#52525B',
            faint:  '#A1A1AA',
            /* Semantyka: mint = zysk / zdrowa bateria, sun = uwaga, accent = ryzyko/uszkodzenie */
            accent: { DEFAULT: '#E11D48', 50: '#FFF1F2', 100: '#FFE4E6', 600: '#E11D48', 700: '#BE123C', 800: '#9F1239' },
            mint:   { DEFAULT: '#10B981', 50: '#ECFDF5', 100: '#D1FAE5', 600: '#059669', 700: '#047857', 800: '#065F46' },
            sun:    { DEFAULT: '#F59E0B', 50: '#FFFBEB', 100: '#FEF3C7', 600: '#D97706', 700: '#B45309', 800: '#92400E' },
            grape:  { DEFAULT: '#8B5CF6', 50: '#F5F3FF', 100: '#EDE9FE', 600: '#7C3AED', 700: '#6D28D9' },
          },
          fontFamily: {
            sans:  ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono:  ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            lift: '0 16px 40px -16px rgba(24, 24, 27, .25)',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/static/css/app.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body data-page="{{ active_page }}">
  <div class="page-shell">
    {% include "components/navbar.html" %}
    <main class="mt-5 space-y-5">
      {% block content %}{% endblock %}
    </main>
    <footer class="mt-6 pb-6 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 text-[10.5px] text-faint font-mono">
      <span>{{ t('footer_note') }}</span>
      <span class="inline-flex items-center gap-1.5"><span class="dot"></span>DeepSeek AI · TLS Scraper · SQLite</span>
    </footer>
  </div>

  {% include "components/modal_details.html" %}
  <div id="toast-stack"></div>

  <!-- Inicjalizacja słownika i18n dla JS -->
  <script>
    window.CURRENT_LANG = "{{ current_lang }}";
    window.TRANSLATIONS = {{ translations_json | safe }};
  </script>
  <script src="/static/js/api.js"></script>
  {% block scripts %}{% endblock %}
  <script>
    lucide.createIcons();
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetailsModal(); });
  </script>
</body>
</html>
